name: paper-agent
on:
  schedule:
    - cron: "0 */3 * * *"            # every 3 hours: soccer, NFL and basketball slates
    - cron: "30 4 * * *"            # overnight: settle finished games, refresh report
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run checklist agent (PAPER MONEY ONLY)
        run: python3 agent.py run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "paper-agent"
          git config user.email "paper-agent@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || (git commit -m "agent run $(date -u +%F\ %H:%M)" && git pull --rebase -q && git push -q)
      - name: Tell my phone if the run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Paper agent DOWN" -H "Tags: warning" -H "Priority: high" -d "A scheduled run failed. Open a new Claude chat and it will check and fix it." "https://ntfy.sh/$NTFY_TOPIC"
